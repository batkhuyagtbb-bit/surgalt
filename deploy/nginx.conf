worker_processes auto;
worker_rlimit_nofile 200000;
events { worker_connections 65535; multi_accept on; }

http {
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65; keepalive_requests 10000;
  server_tokens off;
  gzip on; gzip_comp_level 5; gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Docker DNS: "app" нь 3 хуулбар руу round-robin.
  resolver 127.0.0.11 valid=10s;
  upstream surgalt {
    server app:8080 max_fails=3 fail_timeout=5s;
    keepalive 512;
  }
  map $http_upgrade $conn_upgrade { default upgrade; "" ""; }

  # Нэвтрэлтийн brute-force-оос нэмэлт хамгаалалт (app дотор ч хязгаартай).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  # gRPC + Protobuf API (мобайл, сервис хоорондын): HTTP/2 → app:9090
  upstream surgalt_grpc { server app:9090; keepalive 64; }
  server {
    listen 9090 http2 backlog=4096;
    location / { grpc_pass grpc://surgalt_grpc; grpc_read_timeout 1h; grpc_send_timeout 1h; }
  }

  server {
    listen 80 backlog=4096;  # шинэ холболтын дараалал: viral/flash-crowd үед SYN хаягдахаас хамгаална
    client_max_body_size 2g;          # том видео
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Upgrade $http_upgrade;

    location /api/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://surgalt; }

    location = /api/me/files {
      proxy_request_buffering off;    # upload-ийг шууд app руу урсгана
      proxy_read_timeout 2h; proxy_send_timeout 2h;
      proxy_pass http://surgalt;
    }
    location /api/chat/ws { proxy_read_timeout 1h; proxy_pass http://surgalt; }
    location /files/ { proxy_read_timeout 2h; proxy_buffering off; proxy_pass http://surgalt; }
    location / { proxy_pass http://surgalt; }
  }
}
